version: "2"

linters:
  default: standard
  enable:
    - funlen
    - gocognit
    - wsl_v5
    - revive
  settings:
    funlen:
      lines: 50
      statements: 30
      ignore-comments: true
    gocognit:
      min-complexity: 15
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
